<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="260" rx="12" fill="#fafafa"/>
  <rect width="860" height="260" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">defer：参数当时求值，函数 LIFO 弹出</text>
  <rect x="40" y="60" width="360" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="220" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">函数体执行时压栈</text>
  <rect x="70" y="110" width="300" height="28" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="220" y="130" text-anchor="middle" font-size="12" fill="#0d47a1">defer close(f)     ← 后注册</text>
  <rect x="70" y="148" width="300" height="28" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#1565c0">defer unlock(mu)   ← 先注册</text>
  <text x="220" y="204" text-anchor="middle" font-size="11" fill="#546e7a">参数在这一行就算完，不是返回时</text>
  <rect x="460" y="60" width="360" height="160" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">函数返回时弹出</text>
  <text x="640" y="128" text-anchor="middle" font-size="13" fill="#bf360c">1. close(f)</text>
  <text x="640" y="156" text-anchor="middle" font-size="13" fill="#e65100">2. unlock(mu)</text>
  <text x="640" y="192" text-anchor="middle" font-size="12" fill="#546e7a">后注册的先跑，像栈</text>
</svg>
