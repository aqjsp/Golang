<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="360" rx="12" fill="#fafafa"/>
  <rect width="900" height="360" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">请求进来 → 中间件 → handler → store，ctx 从入口贯到叶子</text>

  <rect x="24" y="52" width="140" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="94" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Client</text>
  <text x="94" y="100" text-anchor="middle" font-size="11" fill="#1565c0">GET /users/{id}</text>

  <line x1="164" y1="87" x2="198" y2="87" stroke="#1565c0" stroke-width="2"/>
  <polygon points="198,87 186,81 186,93" fill="#1565c0"/>

  <rect x="202" y="52" width="160" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="282" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">net/http Server</text>
  <text x="282" y="100" text-anchor="middle" font-size="11" fill="#1565c0">r.Context() 已挂上</text>

  <line x1="362" y1="87" x2="396" y2="87" stroke="#1565c0" stroke-width="2"/>
  <polygon points="396,87 384,81 384,93" fill="#1565c0"/>

  <rect x="400" y="48" width="476" height="78" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="638" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">中间件 Handler → Handler　从外到里</text>
  <rect x="420" y="82" width="130" height="32" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="485" y="103" text-anchor="middle" font-size="12" fill="#e65100">recover</text>
  <rect x="560" y="82" width="130" height="32" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="625" y="103" text-anchor="middle" font-size="12" fill="#e65100">log 状态/耗时</text>
  <rect x="700" y="82" width="154" height="32" rx="6" fill="#ffcc80" stroke="#e65100"/>
  <text x="777" y="103" text-anchor="middle" font-size="12" fill="#e65100">timeout 派生 ctx</text>

  <line x1="777" y1="126" x2="777" y2="154" stroke="#e65100" stroke-width="2"/>
  <polygon points="777,154 771,142 783,142" fill="#e65100"/>

  <rect x="24" y="158" width="420" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="234" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">handler　ServeHTTP</text>
  <text x="44" y="210" font-size="12" fill="#2e7d32">ctx, cancel := WithTimeout(r.Context(), slow)</text>
  <text x="44" y="230" font-size="12" fill="#2e7d32">defer cancel()　禁止 http.Get / Sleep 当下游</text>
  <text x="44" y="248" font-size="11" fill="#546e7a">错误 %w 链，边界 Is 成 JSON，不漏内部串</text>

  <line x1="444" y1="208" x2="478" y2="208" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="478,208 466,202 466,214" fill="#2e7d32"/>
  <text x="461" y="196" text-anchor="middle" font-size="10" fill="#2e7d32">ctx</text>

  <rect x="482" y="158" width="394" height="100" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="679" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">Store 接口　内存 map / SQL</text>
  <text x="502" y="210" font-size="12" fill="#3949ab">Get(ctx, id)　每个阻塞点看 ctx.Done()</text>
  <text x="502" y="230" font-size="12" fill="#3949ab">签名不动就能换 QueryRowContext</text>
  <text x="502" y="248" font-size="11" fill="#5c6bc0">不要返回 typed nil error</text>

  <rect x="24" y="274" width="852" height="62" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="44" y="298" font-size="13" fill="#37474f">ctx 贯穿整条链。handler 里 go f() 且不盯 Done 是反例。SIGINT → Shutdown 等进行中请求，叶子 select 能看见。</text>
  <text x="44" y="320" font-size="12" fill="#78909c">不用完整框架：net/http + ServeMux。最外 recover 吐 JSON 500。Server 已会接 panic；httptest 直接 ServeHTTP 不会，测试必须自己套 Handler()。</text>
</svg>
