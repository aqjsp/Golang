<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="300" rx="12" fill="#fafafa"/>
  <rect width="860" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Go 名字是盒子：类型钉死，赋值拷位模式</text>
  <rect x="30" y="52" width="390" height="220" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="225" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">var a int = 1</text>
  <rect x="80" y="110" width="150" height="56" rx="8" fill="#fff" stroke="#1565c0"/>
  <text x="155" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">a</text>
  <text x="155" y="154" text-anchor="middle" font-size="12" fill="#1565c0">int · 值 1</text>
  <rect x="80" y="184" width="150" height="56" rx="8" fill="#bbdefb" stroke="#1565c0"/>
  <text x="155" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">b := a</text>
  <text x="155" y="228" text-anchor="middle" font-size="12" fill="#1565c0">另一只盒子 · 拷了 1</text>
  <text x="250" y="150" font-size="12" fill="#546e7a">a = 2 改不到 b</text>
  <rect x="440" y="52" width="390" height="220" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="635" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Python 对照：名字是标签</text>
  <rect x="500" y="120" width="80" height="40" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="540" y="146" text-anchor="middle" font-size="13" fill="#bf360c">a</text>
  <rect x="500" y="180" width="80" height="40" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="540" y="206" text-anchor="middle" font-size="13" fill="#bf360c">b</text>
  <rect x="680" y="140" width="110" height="60" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="735" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">对象 1</text>
  <text x="735" y="186" text-anchor="middle" font-size="11" fill="#2e7d32">堆上同一份</text>
  <path d="M 580 140 L 678 160" stroke="#e65100" stroke-width="1.5"/>
  <path d="M 580 200 L 678 180" stroke="#e65100" stroke-width="1.5"/>
  <text x="635" y="250" text-anchor="middle" font-size="12" fill="#e65100">a = "x" 在 Go 里编译失败</text>
</svg>
